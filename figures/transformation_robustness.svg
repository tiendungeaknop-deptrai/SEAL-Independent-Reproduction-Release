<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
  <title id="title">Transformation robustness ROC-AUC</title>
  <desc id="desc">Seven condition AUC values, with Noise0.1 lowest at 0.6472.</desc>
  <rect width="820" height="440" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#202124">
    <text x="410" y="34" text-anchor="middle" font-size="22" font-weight="700">Transformation robustness</text>
    <text x="410" y="57" text-anchor="middle" font-size="13">N = 30 watermarked + 30 controls per condition; outcome: INCONCLUSIVE</text>
    <line x1="85" y1="340" x2="790" y2="340" stroke="#444"/><line x1="85" y1="85" x2="85" y2="340" stroke="#444"/>
    <g font-size="11" text-anchor="end"><text x="77" y="344">0.0</text><text x="77" y="216">0.5</text><text x="77" y="89">1.0</text></g>
    <g fill="#59a14f"><rect x="110" y="85" width="70" height="255"/><rect x="208" y="89" width="70" height="251"/><rect x="306" y="86" width="70" height="254"/><rect x="404" y="114" width="70" height="226"/><rect x="502" y="87" width="70" height="253"/><rect x="600" y="175" width="70" height="165"/><rect x="698" y="85" width="70" height="255"/></g>
    <g font-size="12" font-weight="700" text-anchor="middle"><text x="145" y="78">1.0000</text><text x="243" y="82">0.9861</text><text x="341" y="79">0.9978</text><text x="439" y="107">0.8861</text><text x="537" y="80">0.9939</text><text x="635" y="168">0.6472</text><text x="733" y="78">1.0000</text></g>
    <g font-size="12" text-anchor="middle"><text x="145" y="362">Clean</text><text x="243" y="362">Rot75</text><text x="341" y="362">JPEG25</text><text x="439" y="362">CropScale75</text><text x="537" y="362">Blur8</text><text x="635" y="362">Noise0.1</text><text x="733" y="362">Brightness6</text></g>
    <text transform="translate(25 215) rotate(-90)" text-anchor="middle" font-size="15">Image-level ROC-AUC</text>
  </g>
</svg>

