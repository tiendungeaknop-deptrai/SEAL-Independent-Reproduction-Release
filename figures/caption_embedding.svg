<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Full-scale caption and embedding ablation</title>
  <desc id="desc">Mean angular gaps are 9.3251, 44.5062, and 50.1505 degrees.</desc>
  <rect width="760" height="430" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#202124">
    <text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700">Caption and embedding separation</text>
    <text x="380" y="57" text-anchor="middle" font-size="13">Mean unrelated-minus-related angular gap; N = 1,000/configuration</text>
    <line x1="95" y1="335" x2="720" y2="335" stroke="#444"/><line x1="95" y1="85" x2="95" y2="335" stroke="#444"/>
    <g font-size="11" text-anchor="end"><text x="87" y="339">0</text><text x="87" y="256">20</text><text x="87" y="172">40</text><text x="87" y="89">60</text></g>
    <g fill="#f28e2b"><rect x="155" y="296" width="120" height="39"/><rect x="340" y="150" width="120" height="185"/><rect x="525" y="126" width="120" height="209"/></g>
    <g font-size="17" font-weight="700" text-anchor="middle"><text x="215" y="288">9.3251°</text><text x="400" y="142">44.5062°</text><text x="585" y="118">50.1505°</text></g>
    <g font-size="13" text-anchor="middle"><text x="215" y="360">Direct CLIP</text><text x="215" y="378">image features</text><text x="400" y="360">BLIP-2 + original</text><text x="400" y="378">MPNet</text><text x="585" y="360">BLIP-2 + fine-tuned</text><text x="585" y="378">MPNet artifact</text></g>
    <text transform="translate(28 215) rotate(-90)" text-anchor="middle" font-size="15">Angular gap (degrees)</text>
  </g>
</svg>

